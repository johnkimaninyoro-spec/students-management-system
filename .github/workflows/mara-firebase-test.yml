name: Mara Firebase emulator tests
on:
  push:
    branches: [mara-new-app-test]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: new-app/firebase-tests
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee install.log || { echo "::error::$(tail -c 5000 install.log | tr \"\\n\" \" \")"; exit 1; }
      - name: Test candidate rules in emulator
        working-directory: new-app/firebase-tests
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-mara-school-test "node --test rules.test.cjs" 2>&1 | tee test.log || { echo "::error::$(tail -c 6000 test.log | tr \"\\n\" \" \")"; exit 1; }
