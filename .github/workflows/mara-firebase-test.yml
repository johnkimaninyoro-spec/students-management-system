name: Mara Firebase emulator tests
on:
  push:
    branches: [mara-new-app-test]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
        working-directory: new-app/firebase-tests
      - run: npx firebase emulators:exec --only firestore --project demo-mara-school-test "node --test rules.test.cjs"
        working-directory: new-app/firebase-tests
